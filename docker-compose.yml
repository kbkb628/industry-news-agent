services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://news_agent:news_agent@postgres:5432/news_agent
      REDIS_URL: redis://redis:6379/0
      SEARCH_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: news_agent
      POSTGRES_USER: news_agent
      POSTGRES_PASSWORD: news_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
